<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Werwolf Nexus 🐺</title>
    <style>
        :root { --green: #00ff87; --bg: #050805; }
        body { margin: 0; background: var(--bg); color: var(--green); font-family: 'Courier New', monospace; overflow: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }
        
        #app { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { 
            background: rgba(5, 15, 5, 0.7); border: 1px solid var(--green);
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 135, 0.3);
        }
        
        input { background: transparent; border: 1px solid var(--green); color: white; padding: 10px; width: 220px; margin: 10px 0; outline: none; text-align: center;}
        button { background: var(--green); color: black; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; text-transform: uppercase; }

        /* Паучок с флажком */
        #spider-container { position: absolute; top: -100px; left: 50%; transition: 2s ease; z-index: 3; }
        .spider { font-size: 40px; animation: wave 1s infinite alternate; }
        .flag { background: var(--green); color: black; padding: 5px; font-size: 12px; border-radius: 5px; }
        @keyframes wave { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
    </style>
</head>
<body>
<canvas id="netCanvas"></canvas>

<div id="spider-container">
    <div class="spider">🕷️<div class="flag">Hallo!</div></div>
</div>

<div id="app">
    <div class="card">
        <h1>WERWOLF 🐺</h1>
        <input type="text" id="nick" placeholder="NICKNAME">
        <button onclick="join()">SPIELEN</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    // Анимация паука
    setTimeout(() => document.getElementById('spider-container').style.top = '20px', 500);

    // Паутина (Neural Network)
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let dots = Array.from({length: 60}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()-0.5, vy: Math.random()-0.5}));

    function draw() {
        ctx.fillStyle = "#050805"; ctx.fillRect(0,0, canvas.width, canvas.height);
        dots.forEach(d => {
            d.x += d.vx; d.y += d.vy;
            if(d.x < 0 || d.x > canvas.width) d.vx *= -1;
            if(d.y < 0 || d.y > canvas.height) d.vy *= -1;
        });

        for(let i=0; i<dots.length; i++) {
            for(let j=i+1; j<dots.length; j++) {
                let dist = Math.hypot(dots[i].x-dots[j].x, dots[i].y-dots[j].y);
                if(dist < 180) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(0, 255, 135, ${1 - dist/180})`;
                    ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(draw);
    }
    draw();

    // Firebase (код лобби)
    const db = firebase.database().ref("global_lobby");
    function join() {
        const nick = document.getElementById('nick').value;
        if(!nick) return;
        db.child(nick).set({ online: true });
        db.child(nick).onDisconnect().remove();
        document.querySelector('.card').style.display = 'none';
    }
</script>
</body>
</html>
