<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Werwolf Nexus 🐺</title>
    <style>
        :root { --green: #00ff87; --bg: #050805; }
        body { margin: 0; background: var(--bg); color: var(--green); font-family: 'Courier New', monospace; overflow: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }
        #app { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: rgba(5, 15, 5, 0.7); border: 1px solid var(--green); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 50px rgba(0, 255, 135, 0.3); }
        input { background: transparent; border: 1px solid var(--green); color: white; padding: 10px; width: 220px; margin: 10px 0; outline: none; text-align: center; }
        button { background: var(--green); color: black; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        #spider-container { position: absolute; top: 20px; left: 50%; z-index: 3; transition: 2s; }
        .flag { background: var(--green); color: black; padding: 5px; font-size: 12px; border-radius: 5px; }
        #playersContainer { position: fixed; bottom: 50px; width: 100%; text-align: center; z-index: 5; }
        .player-item { display: inline-block; margin: 10px; padding: 10px 20px; border: 1px solid var(--green); border-radius: 20px; background: rgba(0, 255, 135, 0.1); }
    </style>
</head>
<body>
<canvas id="netCanvas"></canvas>

<div id="spider-container">
    🕷️<div class="flag">Hallo!</div>
</div>

<div id="app">
    <div class="card" id="loginCard">
        <h1>WERWOLF 🐺</h1>
        <input type="text" id="nick" placeholder="NICKNAME">
        <button onclick="join()">SPIELEN</button>
    </div>
</div>

<div id="playersContainer"></div>

<script>
    // Паутинка
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let dots = Array.from({length: 50}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()-0.5, vy: Math.random()-0.5}));

    function draw() {
        ctx.fillStyle = "#050805"; ctx.fillRect(0,0, canvas.width, canvas.height);
        dots.forEach(d => {
            d.x += d.vx; d.y += d.vy;
            if(d.x < 0 || d.x > canvas.width) d.vx *= -1;
            if(d.y < 0 || d.y > canvas.height) d.vy *= -1;
        });
        dots.forEach((d, i) => {
            dots.slice(i+1).forEach(d2 => {
                let dist = Math.hypot(d.x-d2.x, d.y-d2.y);
                if(dist < 150) {
                    ctx.beginPath(); ctx.strokeStyle = `rgba(0, 255, 135, ${1 - dist/150})`;
                    ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.stroke();
                }
            });
        });
        requestAnimationFrame(draw);
    }
    draw();

    // Локальная логика без Firebase
    let players = JSON.parse(localStorage.getItem('werwolf_players')) || [];

    function join() {
        const nick = document.getElementById('nick').value.trim();
        if(!nick) return;
        if(!players.includes(nick)) {
            players.push(nick);
            localStorage.setItem('werwolf_players', JSON.stringify(players));
            render();
            document.getElementById('loginCard').style.display = 'none';
        }
    }

    function render() {
        document.getElementById('playersContainer').innerHTML = players
            .map(n => `<div class="player-item">👤 ${n}</div>`).join('');
    }
    render();
</script>
</body>
</html>
