<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werwolf Realtime Edition</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --primary: #45f3ff;
            --accent: #ff0055;
            --text: #c5c6c7;
            --admin-color: #00ff87;
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
        }
        .box { 
            max-width: 650px; 
            margin: 30px auto; 
            background: var(--panel); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.1); 
            border: 1px solid rgba(69, 243, 255, 0.2); 
        }
        h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        button { 
            background: linear-gradient(45deg, var(--accent), #cc0044); 
            color: white; border: none; padding: 12px 24px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; 
            cursor: pointer; margin: 8px; transition: 0.2s; 
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4); }
        .btn-vote { background: linear-gradient(45deg, var(--primary), #00b3cc); color: #000; display: block; width: 80%; margin: 10px auto; padding: 14px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-admin { background: transparent; border: 1px dashed var(--admin-color); color: var(--admin-color); font-size: 12px; padding: 6px 12px; margin-top: 20px; opacity: 0.6; }
        .btn-admin:hover { opacity: 1; transform: none; box-shadow: 0 0 10px rgba(0, 255, 135, 0.3); }
        input { 
            padding: 12px; font-size: 16px; border-radius: 8px; 
            border: 2px solid var(--primary); background: #0f1115; 
            color: white; margin-bottom: 20px; width: 75%; text-align: center; outline: none; 
        }
        .hidden { display: none !important; }
        .grid-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 20px 0; }
        .player-card { background: #0f1115; padding: 12px; border-radius: 8px; border: 1px solid var(--primary); color: #fff; font-weight: bold; }
        
        .admin-card { background: #0f1115; padding: 15px; border-radius: 10px; border: 2px solid var(--admin-color); text-align: center; }
        .admin-role { font-size: 18px; font-weight: bold; color: var(--admin-color); margin-bottom: 5px; }
        .admin-name { font-size: 14px; color: #fff; }
        .dead-player { opacity: 0.4; border-color: #555 !important; text-decoration: line-through; }

        .card-container { width: 160px; height: 230px; margin: 20px auto; perspective: 1000px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-front { background: linear-gradient(135deg, #1f2438, #0d101d); border: 3px solid var(--primary); }
        .card-back { background: linear-gradient(135deg, #2c161f, #12050b); border: 3px solid var(--accent); transform: rotateY(180deg); }
        
        .log-box { text-align: left; background: #0f1115; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 150px; overflow-y: auto; border-left: 4px solid var(--accent); font-size: 14px; }
        .vote-badge { background: #000; color: var(--primary); padding: 2px 8px; border-radius: 12px; margin-left: 10px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <h1>Werwolf Local-Net 🐺</h1>

    <!-- ШАГ 1: Вход -->
    <div id="login-screen">
        <p>Gib deinen Nickname ein:</p>
        <input type="text" id="username" placeholder="Name..." maxlength="12"><br>
        <button onclick="joinLobby()">Lobby beitreten</button>
        <br>
        <button class="btn-admin" onclick="openAdminPanel()">Admin-Bereich 🔐</button>
    </div>

    <!-- ЭКРАН АДМИНА -->
    <div id="admin-screen" class="hidden">
        <h2 style="color: var(--admin-color);">Lehrer-Dashboard 👁️</h2>
        <p style="color: #aaa;">Echtzeit-Rollen und Spielverlauf:</p>
        <div class="grid-players" id="admin-roles-container"></div>
        <div class="log-box" id="admin-game-log" style="border-left-color: var(--admin-color);"><b>Spielstatus:</b> Synchronisiere...</div>
        <button onclick="resetGameGlobal()" style="background: var(--accent); margin-top: 20px; font-size: 14px;">Spiel komplett zurücksetzen 🔄</button>
    </div>

    <!-- ШАГ 2: Ожидание -->
    <div id="lobby-screen" class="hidden">
        <h3>Warteraum (<span id="count" style="color:var(--primary)">0</span>/19)</h3>
        <div class="grid-players" id="players-container"></div>
        <p id="wait-msg" style="color: #777;">Warte auf Spieler...</p>
        <button id="start-game-btn" class="hidden" onclick="triggerGameStart()" style="background: linear-gradient(45deg, #00ff87, #60efff); color: #000;">Spiel starten 🚀</button>
    </div>

    <!-- ШАГ 3: Игра -->
    <div id="game-screen" class="hidden">
        <h2 id="player-display-name" style="color: #fff;">Spieler: ???</h2>
        <h3 id="phase-title" style="color: var(--accent);">Karten werden verteilt...</h3>
        
        <div class="card-container" id="card-box">
            <div class="card" id="main-card">
                <div class="card-face card-back"><div style="font-size:50px;">❓</div></div>
                <div class="card-face card-front">
                    <div style="font-size:60px;" id="role-avatar">🐺</div>
                    <div id="role-title" style="font-weight:bold; margin-top:10px; color:var(--primary)">Role</div>
                </div>
            </div>
        </div>
        
        <button id="spin-btn" onclick="revealMyCard()">Karte anzeigen (720°)</button>
        <button id="confirm-role-btn" class="hidden" onclick="confirmMyRole()" style="background: linear-gradient(45deg, #00ff87, #60efff); color: #000;">Ich habe meine Rolle gemerkt ✅</button>
        
        <p id="action-prompt" style="font-weight: bold; margin-top: 15px; color: #fff;"></p>
        <div id="voting-targets"></div>
        
        <div class="log-box" id="game-log"><b>Spielstatus:</b><br><div id="status-text">Warte auf Synchronisation...</div></div>
    </div>
</div>

<script>
    // Сверхбыстрый локальный канал связи между вкладками браузера
    const channel = new BroadcastChannel('werwolf_local_channel');

    let myName = "";
    let myRole = "";
    let isAdmin = false;
    
    let currentDB = { players: [], roles: {}, alive: {}, confirmed: [], votes: {}, round: "1", logs: ["🎭 Bereit für ein neues Spiel!"], state: "" };

    const ROLES_TEXT = {
        'Werwolf': { name: 'Werwolf 🐺', avatar: '🐺' },
        'Seherin': { name: 'Seherin 🔮', avatar: '🔮' },
        'Hexe': { name: 'Hexe 🧪', avatar: '🧪' },
        'Jäger': { name: 'Jäger 🏹', avatar: '🏹' },
        'Dorfbewohner': { name: 'Dorfbewohner 👨‍🌾', avatar: '👨‍🌾' }
    };

    // Прием данных от других вкладок
    channel.onmessage = (event) => {
        if (event.data.type === 'SYNC') {
            currentDB = event.data.db;
            if (isAdmin) { syncAdminUI(); } else if (myName) { syncPlayerUI(); }
        } else if (event.data.type === 'PING' && myName === currentDB.players[0]) {
            sendSync(); // Главная вкладка отвечает актуальной базой
        }
    };

    function sendSync() {
        channel.postMessage({ type: 'SYNC', db: currentDB });
        if (isAdmin) { syncAdminUI(); } else if (myName) { syncPlayerUI(); }
    }

    function openAdminPanel() {
        let password = prompt("Bitte Admin-Code eingeben:");
        if (password === "2026") {
            isAdmin = true;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.remove('hidden');
            channel.postMessage({ type: 'PING' });
            setTimeout(syncAdminUI, 200);
        } else { alert("Falscher Code!"); }
    }

    function joinLobby() {
        const input = document.getElementById('username');
        myName = input.value.trim();
        if (!myName) return alert("Bitte Name eingeben!");
        
        if (currentDB.state && currentDB.state !== "") return alert("Das Spiel läuft bereits!");
        if (currentDB.players && currentDB.players.includes(myName)) return alert("Name vergeben!");

        currentDB.players.push(myName);
        sendSync();

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    function syncAdminUI() {
        const container = document.getElementById('admin-roles-container');
        if (!currentDB.state) {
            container.innerHTML = currentDB.players.map(p => `
                <div class="admin-card"><div class="admin-role">Wartet...</div><div class="admin-name">${p}</div></div>
            `).join('');
            document.getElementById('admin-game-log').innerHTML = "<b>Spielstatus:</b> Lobby-Phase. Warte auf Start...";
        } else {
            container.innerHTML = currentDB.players.map(p => {
                let role = currentDB.roles[p] || "Dorfbewohner";
                let isAlive = currentDB.alive[p] !== false;
                let roleName = ROLES_TEXT[role] ? ROLES_TEXT[role].name : role;
                return `<div class="admin-card ${isAlive ? '' : 'dead-player'}"><div class="admin-role">${roleName}</div><div class="admin-name">${p} ${isAlive ? '' : '💀'}</div></div>`;
            }).join('');
            document.getElementById('admin-game-log').innerHTML = `<b>Status: Runde ${currentDB.round}</b><br>` + currentDB.logs.map(l => `<div style='margin-top:5px;'>${l}</div>`).join('');
        }
    }

    function syncPlayerUI() {
        if (!currentDB.state || currentDB.state === "") {
            document.getElementById('count').innerText = currentDB.players.length;
            document.getElementById('players-container').innerHTML = currentDB.players.map(p => `<div class="player-card">👤 ${p}</div>`).join('');
            if (currentDB.players.length >= 3) {
                document.getElementById('wait-msg').classList.add('hidden');
                document.getElementById('start-game-btn').classList.remove('hidden');
            } else {
                document.getElementById('wait-msg').classList.remove('hidden');
                document.getElementById('start-game-btn').classList.add('hidden');
            }
        } 
        else if (currentDB.state === 'STARTED') {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('player-display-name').innerText = `Spieler: ${myName}`;
            myRole = currentDB.roles[myName] || 'Dorfbewohner';
        } 
        else if (currentDB.state === 'NIGHT' || currentDB.state === 'DAY') {
            document.getElementById('spin-btn').classList.add('hidden');
            document.getElementById('confirm-role-btn').classList.add('hidden');
            document.getElementById('card-box').classList.add('hidden');
            document.getElementById('phase-title').innerText = `Runde ${currentDB.round} - ${currentDB.state === 'NIGHT' ? 'Nacht 🌙' : 'Tag ☀️'}`;
            updateLogsUI(currentDB.logs);
            renderTargetsUI();
        }
        else if (currentDB.state === 'ENDED') {
            updateLogsUI(currentDB.logs);
            document.getElementById('voting-targets').innerHTML = "";
            document.getElementById('action-prompt').innerText = "Spiel vorbei!";
        }
    }

    function triggerGameStart() {
        let count = currentDB.players.length;
        let rolesPool = [];
        if (count <= 4) rolesPool = ['Werwolf', 'Seherin', 'Dorfbewohner', 'Dorfbewohner'];
        else rolesPool = ['Werwolf', 'Werwolf', 'Seherin', 'Hexe'];
        while (rolesPool.length < count) rolesPool.push('Dorfbewohner');
        rolesPool.sort(() => Math.random() - 0.5);

        currentDB.roles = {}; currentDB.alive = {};
        currentDB.players.forEach((p, idx) => { currentDB.roles[p] = rolesPool[idx]; currentDB.alive[p] = true; });
        currentDB.state = 'STARTED'; currentDB.confirmed = [];
        currentDB.logs.push("🎭 Spiel hat begonnen! Merkt euch die Rollen...");
        sendSync();
    }

    function revealMyCard() {
        document.getElementById('spin-btn').classList.add('hidden');
        const info = ROLES_TEXT[myRole] || { name: 'Dorfbewohner 👨‍🌾', avatar: '👨‍🌾' };
        document.getElementById('role-avatar').innerText = info.avatar;
        document.getElementById('role-title').innerText = info.name;
        const card = document.getElementById('main-card');
        card.style.transform = 'rotateY(720deg)';
        setTimeout(() => { document.getElementById('confirm-role-btn').classList.remove('hidden'); }, 2000);
    }

    function confirmMyRole() {
        document.getElementById('confirm-role-btn').classList.add('hidden');
        document.getElementById('status-text').innerText = "Bereit! Warte...";
        if (!currentDB.confirmed.includes(myName)) currentDB.confirmed.push(myName);
        if (currentDB.confirmed.length === currentDB.players.length) { currentDB.state = 'NIGHT'; currentDB.votes = {}; }
        sendSync();
    }

    function renderTargetsUI() {
        const container = document.getElementById('voting-targets');
        const prompt = document.getElementById('action-prompt');
        if (!currentDB.alive[myName]) { prompt.innerHTML = "Du bist tot... 💀"; container.innerHTML = ""; return; }

        let activeVoters = currentDB.state === 'NIGHT' ? currentDB.players.filter(p => currentDB.alive[p] && currentDB.roles[p] === 'Werwolf') : currentDB.players.filter(p => currentDB.alive[p]);
        let voteCounts = {};
        activeVoters.forEach(voter => { let target = currentDB.votes[voter]; if (target) voteCounts[target] = (voteCounts[target] || 0) + 1; });

        if (currentDB.state === 'NIGHT') {
            if (myRole === 'Werwolf') { prompt.innerText = "🐺 Werwolf-Sitzung: Wähle ein Opfer:"; generateButtons(voteCounts, activeVoters.length); }
            else { prompt.innerText = "🌙 Es ist Nacht. Das Dorf schläft..."; container.innerHTML = ""; }
        } else {
            prompt.innerText = "☀️ Dorfgericht: Wählt, wer gehängt werden soll:"; generateButtons(voteCounts, activeVoters.length);
        }
    }

    function generateButtons(voteCounts, totalVoters) {
        const container = document.getElementById('voting-targets'); container.innerHTML = "";
        currentDB.players.forEach(player => {
            if (currentDB.alive[player] && player !== myName) {
                const btn = document.createElement('button'); btn.className = 'btn-vote';
                btn.innerHTML = `🎯 ${player} <span class="vote-badge">${voteCounts[player] || 0}/${totalVoters}</span>`;
                btn.onclick = () => castVoteOnline(player);
                container.appendChild(btn);
            }
        });
    }

    function castVoteOnline(target) {
        currentDB.votes[myName] = target;
        let activeVoters = currentDB.state === 'NIGHT' ? currentDB.players.filter(p => currentDB.alive[p] && currentDB.roles[p] === 'Werwolf') : currentDB.players.filter(p => currentDB.alive[p]);
        if (activeVoters.filter(v => currentDB.votes[v]).length >= activeVoters.length) { processResolution(); } else { sendSync(); }
    }

    function processResolution() {
        let targetCounts = {}; Object.values(currentDB.votes).forEach(t => { targetCounts[t] = (targetCounts[t] || 0) + 1; });
        let victim = Object.keys(targetCounts).reduce((a, b) => targetCounts[a] > targetCounts[b] ? a : b, null);
        if (victim) {
            currentDB.alive[victim] = false;
            currentDB.logs.push(currentDB.state === 'NIGHT' ? `🌙 <b>${victim}</b> wurde gefressen!` : `☀️ <b>${victim}</b> wurde gehängt!`);
        }
        currentDB.votes = {};
        if (checkEndGame()) return;
        currentDB.state = currentDB.state === 'NIGHT' ? 'DAY' : 'NIGHT';
        if (currentDB.state === 'NIGHT') currentDB.round = (parseInt(currentDB.round) + 1).toString();
        sendSync();
    }

    function checkEndGame() {
        let wolves = currentDB.players.filter(p => currentDB.alive[p] && currentDB.roles[p] === 'Werwolf').length;
        let villagers = currentDB.players.filter(p => currentDB.alive[p] && currentDB.roles[p] !== 'Werwolf').length;
        if (wolves === 0) { currentDB.logs.push("<br>🏆 Dorfbewohner gewinnen!"); currentDB.state = 'ENDED'; sendSync(); return true; }
        if (wolves >= villagers) { currentDB.logs.push("<br>🐺 Werwölfe gewinnen!"); currentDB.state = 'ENDED'; sendSync(); return true; }
        return false;
    }

    function resetGameGlobal() { currentDB = { players: [], roles: {}, alive: {}, confirmed: [], votes: {}, round: "1", logs: ["🔄 Reset!"], state: "" }; sendSync(); }
    function updateLogsUI(logs) { const logBox = document.getElementById('game-log'); if (logBox) logBox.innerHTML = "<b>Spielstatus:</b>" + logs.map(l => `<div>${l}</div>`).join(''); }
    
    // Запрос актуальной базы при открытии новой вкладки
    channel.postMessage({ type: 'PING' });
</script>
</body>
</html>
