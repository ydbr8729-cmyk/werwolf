<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Werwolf Game</title>
    <style>
        body { margin: 0; background: #0b0c10; color: white; font-family: sans-serif; overflow: hidden; }
        #bgCanvas { position: fixed; z-index: -1; }
        .card { 
            background: rgba(31, 40, 51, 0.8); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 20px; border: 1px solid #45f3ff;
            width: 350px; text-align: center; margin: 15% auto;
            animation: spin 2s ease-in-out;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(720deg); } }
        .player-item { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="card" id="card">
    <div id="setup">
        <h1>Werwolf 🐺</h1>
        <input type="text" id="nick" placeholder="Dein Name...">
        <button onclick="join()">Beitreten</button>
    </div>
    <div id="lobby" style="display:none;">
        <h3>Spieler im Dorf:</h3>
        <div id="playersList"></div>
        <p id="roleDisplay"></p>
    </div>
</div>

<script>
    // ... (код частиц такой же, как раньше) ...

    function join() {
        const nick = document.getElementById('nick').value;
        if(nick.length < 2) return alert("Zu kurz!");
        
        // Логика ролей (базовая)
        const roles = ["Werwolf", "Amor", "Seher", "Dorfbewohner"];
        const myRole = roles[Math.floor(Math.random() * roles.length)];
        
        document.getElementById('setup').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('roleDisplay').innerText = "Deine Rolle: " + myRole;
        
        // Тут пойдет запись в Firebase
    }
</script>
</body>
</html>
