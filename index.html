<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Werwolf Nexus 🐺</title>
    <style>
        :root { --neon-green: #00ff87; --bg: #050805; }
        body { margin: 0; background: var(--bg); color: var(--neon-green); font-family: 'Courier New', monospace; overflow: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }
        
        #app { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { 
            background: rgba(5, 15, 5, 0.8); border: 2px solid var(--neon-green);
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 135, 0.2);
            animation: rotateEntry 2s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        @keyframes rotateEntry { from { transform: rotate(0deg) scale(0); } to { transform: rotate(720deg) scale(1); } }
        
        input { background: transparent; border: 1px solid var(--neon-green); color: white; padding: 10px; width: 200px; display: block; margin: 10px auto; }
        button { background: var(--neon-green); border: none; padding: 10px 30px; cursor: pointer; font-weight: bold; }
        
        #spider { position: absolute; top: -50px; font-size: 30px; transition: 2s; }
        .player-item { display: inline-block; margin: 10px; padding: 10px; border: 1px solid var(--neon-green); border-radius: 10px; }
    </style>
</head>
<body>
<canvas id="netCanvas"></canvas>
<div id="spider">🕷️</div>

<div id="app">
    <div class="card" id="card">
        <h1>WERWOLF</h1>
        <div id="login">
            <input type="text" id="nick" placeholder="Nickname">
            <button onclick="join()">SPIELEN</button>
        </div>
    </div>
</div>

<div id="playersContainer" style="position:fixed; bottom:20px; width:100%; text-align:center;"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    // Паучок-анимация
    setTimeout(() => document.getElementById('spider').style.top = '20px', 500);

    // Паутинка (Network)
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let dots = Array.from({length: 40}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()-0.5, vy: Math.random()-0.5}));

    function draw() {
        ctx.fillStyle = "#050805"; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(0, 255, 135, 0.2)";
        dots.forEach((d, i) => {
            d.x += d.vx; d.y += d.vy;
            if(d.x < 0 || d.x > canvas.width) d.vx *= -1;
            if(d.y < 0 || d.y > canvas.height) d.vy *= -1;
            dots.forEach((d2, j) => {
                if(Math.hypot(d.x-d2.x, d.y-d2.y) < 150) {
                    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.stroke();
                }
            });
        });
        requestAnimationFrame(draw);
    }
    draw();

    // Firebase (код лобби)
    const db = firebase.database().ref("global_lobby");
    function join() {
        const nick = document.getElementById('nick').value;
        if(!nick) return;
        db.child(nick).set({ online: true });
        db.child(nick).onDisconnect().remove();
        document.getElementById('card').style.display = 'none';
    }

    db.on('value', snap => {
        const p = snap.val() || {};
        document.getElementById('playersContainer').innerHTML = Object.keys(p)
            .map(n => `<div class="player-item">👤 ${n}</div>`).join('');
    });
</script>
</body>
</html>
