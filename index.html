<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Werwolf Game 🐺</title>
    <style>
        :root { --bg: #0b0c10; --primary: #45f3ff; --admin: #00ff87; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { max-width: 500px; margin: auto; background: #1f2833; padding: 20px; border-radius: 10px; }
        input { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { background: var(--primary); padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .admin-panel { border: 2px solid var(--admin); padding: 10px; margin-top: 20px; text-align: left; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="box">
    <h1>Werwolf Game 🐺</h1>
    
    <div id="setup">
        <input type="text" id="gameCode" placeholder="Code">
        <input type="text" id="nick" placeholder="Nickname">
        <button onclick="join()">Lobby beitreten</button>
        <br><br>
        <button onclick="adminLogin()" style="background:var(--admin)">Admin-Login</button>
    </div>

    <div id="lobby" style="display:none;">
        <h2 id="roomTitle"></h2>
        <div id="playersList"></div>
    </div>

    <div id="adminPanel" class="admin-panel" style="display:none;">
        <h3>Admin-Kontrolle 🛡️</h3>
        <div id="adminStatus"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://werwolf-test-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function adminLogin() {
        if(prompt("Passwort:") === "2026") {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            let code = prompt("Welcher Raum?");
            monitorRoom(code);
        }
    }

    function join() {
        let code = document.getElementById('gameCode').value;
        let nick = document.getElementById('nick').value;
        db.ref("rooms/" + code + "/players").push(nick);
        document.getElementById('setup').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('roomTitle').innerText = "Raum: " + code;
        
        db.ref("rooms/" + code + "/players").on('value', snap => {
            document.getElementById('playersList').innerHTML = Object.values(snap.val() || {}).map(n => `<div>👤 ${n}</div>`).join('');
        });
    }

    function monitorRoom(code) {
        db.ref("rooms/" + code).on('value', snap => {
            const data = snap.val();
            let html = "<h4>Spieler:</h4>";
            for(let key in data.players) html += `<div>${data.players[key]}</div>`;
            document.getElementById('adminStatus').innerHTML = html;
        });
    }
</script>
</body>
</html>
