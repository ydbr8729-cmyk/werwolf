<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="login">
        <input type="text" id="gameCode" placeholder="Код игры (напр. 4829)">
        <input type="text" id="nick" placeholder="Твой ник">
        <button onclick="joinGame()">Войти в игру</button>
    </div>
    <div id="lobby" style="display:none;">
        <h2 id="roomTitle">Комната: </h2>
        <div id="playersList"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://werwolf-test-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);

        function joinGame() {
            const code = document.getElementById('gameCode').value;
            const name = document.getElementById('nick').value;
            if(!code || !name) return alert("Введите код и ник!");

            const db = firebase.database().ref("rooms/" + code);
            
            db.once('value', (snap) => {
                const room = snap.val();
                const players = room ? Object.values(room.players || {}) : [];

                if(players.length >= 19) return alert("Лобби забито (лимит 19)!");
                
                db.child('players').push(name);
                document.getElementById('login').style.display = 'none';
                document.getElementById('lobby').style.display = 'block';
                document.getElementById('roomTitle').innerText = "Комната: " + code;
                
                // Слушаем только ЭТУ комнату
                db.child('players').on('value', s => {
                    const p = s.val();
                    document.getElementById('playersList').innerHTML = Object.values(p || {}).map(n => `<div>👤 ${n}</div>`).join('');
                });
            });
        }
    </script>
</body>
</html>
