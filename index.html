<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Werwolf Live 🐺</title>
    <style>
        :root { --neon: #45f3ff; --bg: #0b0c10; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { width: 100%; max-width: 400px; background: #1f2833; padding: 25px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; outline: none; }
        button { width: 88%; padding: 12px; background: var(--neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        .player-item { padding: 10px; border-bottom: 1px solid #454545; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="card" id="app">
    <h1>Werwolf 🐺</h1>
    <div id="login">
        <input type="text" id="nick" placeholder="Твой никнейм...">
        <button onclick="join()">Войти в лобби</button>
    </div>
    <div id="lobby" style="display:none;">
        <h3>Игроки в комнате:</h3>
        <div id="playersList"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://werwolf-test-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("global_lobby");

    function join() {
        const nick = document.getElementById('nick').value;
        if(!nick) return alert("Ник давай!");
        
        const playerRef = db.child(nick);
        playerRef.set({ online: true });
        playerRef.onDisconnect().remove(); // Уходит, если закрыл вкладку

        document.getElementById('login').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
    }

    db.on('value', snap => {
        const players = snap.val() || {};
        document.getElementById('playersList').innerHTML = Object.keys(players)
            .map(n => `<div class="player-item">👤 ${n}</div>`).join('');
    });
</script>
</body>
</html>
